name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dependency tree
        run: |
          pip check

      - name: Verify canonical datasets and LFS model artifact
        run: |
          test -f data/processed/train.csv || (echo "Missing train.csv" && exit 1)
          test -f data/processed/validation.csv || (echo "Missing validation.csv" && exit 1)
          test -f data/processed/test.csv || (echo "Missing test.csv" && exit 1)
          test -f models/random_forest_final.joblib || (echo "Missing model artifact" && exit 1)
          
          # Verify the model file is the real binary artifact (> 10MB), not an unresolved LFS pointer
          filesize=$(stat -c%s "models/random_forest_final.joblib" 2>/dev/null || stat -f%z "models/random_forest_final.joblib")
          if [ "$filesize" -lt 10000000 ]; then
            echo "Error: models/random_forest_final.joblib is an unresolved LFS pointer ($filesize bytes)"
            exit 1
          fi
          echo "Verified model artifact: $filesize bytes"

      - name: Run complete test suite (158 tests)
        run: |
          python -m pytest tests -v

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          BACKEND_API_URL: http://127.0.0.1:8000/api/:path*
